name: Exchange GitHub OIDC token
description: Exchange a GitHub Actions OIDC token for a scoped GitHub App installation token.

inputs:
  exchange-url:
    description: Full HTTPS URL of the simple-sts exchange endpoint.
    required: true
  audience:
    description: HTTPS OIDC audience configured in the simple-sts policy.
    required: true
  repository:
    description: Target repository requested from the simple-sts policy.
    required: false
  repositories:
    description: Newline-delimited target repositories requested from a multi-repository simple-sts policy rule.
    required: false
  permissions:
    description: Newline-delimited GitHub App repository permissions requested from the simple-sts policy.
    required: false
  delivery:
    description: Select token delivery or an encrypted github-proxy capability.
    required: false
    default: token
  branch:
    description: Exact branch authorized by github-proxy delivery.
    required: false
  expected-head:
    description: Expected previous branch head, or forty zeroes for a new branch.
    required: false

outputs:
  token:
    description: Short-lived GitHub App installation token.
  capability:
    description: Encrypted, exact-branch GitHub proxy capability.
  expires-at:
    description: Expiration time reported by GitHub.
  repository:
    description: Repository authorized by the exchange policy.
  repositories:
    description: Newline-delimited repositories authorized by a multi-repository exchange policy.
  ref:
    description: Git ref authorized by the exchange policy.
  branch:
    description: Exact branch authorized by a GitHub proxy capability.
  expected-head:
    description: Expected previous branch head authorized by a GitHub proxy capability.

runs:
  using: node24
  main: action/main.js
  post: action/post.js
  post-if: always()
