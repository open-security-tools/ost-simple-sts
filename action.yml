name: Exchange GitHub OIDC token
description: Exchange a GitHub Actions OIDC token for a scoped GitHub App installation token.

inputs:
  exchange-url:
    description: Full HTTPS URL of the simple-sts exchange endpoint.
    required: true
  audience:
    description: OIDC audience configured in the simple-sts policy.
    required: true

outputs:
  token:
    description: Short-lived GitHub App installation token.
    value: ${{ steps.exchange.outputs.token }}
  expires-at:
    description: Expiration time reported by GitHub.
    value: ${{ steps.exchange.outputs.expires-at }}
  repository:
    description: Repository authorized by the exchange policy.
    value: ${{ steps.exchange.outputs.repository }}
  ref:
    description: Git ref authorized by the exchange policy.
    value: ${{ steps.exchange.outputs.ref }}

runs:
  using: composite
  steps:
    - id: exchange
      shell: bash
      env:
        EXCHANGE_URL: ${{ inputs.exchange-url }}
        OIDC_AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail

        node "$GITHUB_ACTION_PATH/scripts/validate-exchange-url.js" "$EXCHANGE_URL" "$OIDC_AUDIENCE"

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "id-token: write is required to request a GitHub OIDC token" >&2
          exit 1
        fi

        audience=$(jq --null-input --raw-output --arg value "$OIDC_AUDIENCE" '$value | @uri')
        oidc_response=$(curl --silent --show-error --fail \
          --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")
        oidc_token=$(jq --exit-status --raw-output '.value | select(type == "string" and length > 0)' <<<"$oidc_response")
        echo "::add-mask::$oidc_token"

        response=$(curl --silent --show-error --fail \
          --request POST \
          --header "Authorization: Bearer $oidc_token" \
          --data '' \
          "$EXCHANGE_URL")
        token=$(jq --exit-status --raw-output '.token | select(type == "string" and length > 0)' <<<"$response")
        expires_at=$(jq --exit-status --raw-output '.expires_at | select(type == "string" and length > 0)' <<<"$response")
        repository=$(jq --exit-status --raw-output '.repository | select(type == "string" and length > 0)' <<<"$response")
        git_ref=$(jq --exit-status --raw-output '.ref | select(type == "string" and length > 0)' <<<"$response")
        echo "::add-mask::$token"

        {
          echo "token=$token"
          echo "expires-at=$expires_at"
          echo "repository=$repository"
          echo "ref=$git_ref"
        } >>"$GITHUB_OUTPUT"
