AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ost-simple-sts - exchanges GitHub Actions OIDC tokens for short-lived
  GitHub App installation tokens.

Metadata:
  AWS::ServerlessRepo::Application:
    Name: ost-simple-sts
    Description: Exchange GitHub Actions OIDC tokens for scoped GitHub App installation tokens.
    Author: open-security-tools
    LicenseUrl: LICENSE
    ReadmeUrl: README.md
    Labels:
      - github-actions
      - github-app
      - oidc
      - security
    HomePageUrl: https://github.com/open-security-tools/ost-simple-sts
    SourceCodeUrl: https://github.com/open-security-tools/ost-simple-sts

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 256

Parameters:
  PolicyRepository:
    Type: String
    MinLength: 3
    MaxLength: 201
    AllowedPattern: '(?!.*[.][.])(?!.*[.](/|$))[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}'
    Description: Repository that owns the trusted broker policy
  PolicyRepositoryId:
    Type: Number
    MinValue: 1
    Description: Immutable ID of the policy repository
  PolicyInstallationId:
    Type: Number
    MinValue: 1
    Description: GitHub App installation that can read the policy repository
  PolicyPath:
    Type: String
    Default: .github/ost-simple-sts.json
    MinLength: 14
    MaxLength: 300
    AllowedPattern: '[.]github/(?!.*[.][.])(?!.*[.](/|$))([A-Za-z0-9_-][A-Za-z0-9_.-]{0,99}/)*[A-Za-z0-9_-][A-Za-z0-9_.-]{0,94}[.]json'
    Description: JSON policy path under .github
  PolicyRef:
    Type: String
    Default: main
    AllowedValues: [main]
  PolicyAudience:
    Type: String
    Default: ''
    Description: Optional GitHub Actions OIDC audience; defaults to the deployed API URL
  AppIdParameterName:
    Type: String
    Default: /ost/app-id
  AppPrivateKeySecretName:
    Type: String
    Description: Secrets Manager secret name containing the GitHub App PEM private key
  JtiTableName:
    Type: String
    Default: ost-jti-replay
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for CloudWatch alarm notifications

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  HasPolicyAudience: !Not [!Equals [!Ref PolicyAudience, '']]

Resources:
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP

  ApiApiGatewayDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/${AWS::StackName}/${StackInstanceId}/http-api
        - StackInstanceId: !Select
            - 2
            - !Split ['/', !Ref 'AWS::StackId']
      RetentionInDays: 30

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /ost-simple-sts/${AWS::StackName}/${StackInstanceId}/simple-sts
        - StackInstanceId: !Select
            - 2
            - !Split ['/', !Ref 'AWS::StackId']
      RetentionInDays: 30

  JtiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref JtiTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti_hash
          AttributeType: S
      KeySchema:
        - AttributeName: jti_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SimpleStsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: .
      Handler: bootstrap
      ReservedConcurrentExecutions: 100
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          POLICY_REPOSITORY: !Ref PolicyRepository
          POLICY_REPOSITORY_ID: !Ref PolicyRepositoryId
          POLICY_INSTALLATION_ID: !Ref PolicyInstallationId
          POLICY_PATH: !Ref PolicyPath
          POLICY_REF: !Ref PolicyRef
          POLICY_AUDIENCE: !If
            - HasPolicyAudience
            - !Ref PolicyAudience
            - !GetAtt Api.ApiEndpoint
          APP_ID_PARAMETER: !Ref AppIdParameterName
          APP_PRIVATE_KEY_SECRET_NAME: !Ref AppPrivateKeySecretName
          JTI_TABLE_NAME: !Ref JtiTableName
          RUST_LOG: warn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt JtiTable.Arn
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppIdParameterName}
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppPrivateKeySecretName}-??????

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SimpleStsFunction.Arn
      PayloadFormatVersion: '2.0'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /health
      Target: !Sub integrations/${ApiIntegration}

  ExchangeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /exchange
      Target: !Sub integrations/${ApiIntegration}

  SimpleStsFunctionHealthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SimpleStsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/health

  SimpleStsFunctionExchangePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SimpleStsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/exchange

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopic
    Properties:
      AlarmDescription: Lambda invocation errors for the credential broker
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SimpleStsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopic
    Properties:
      AlarmDescription: Lambda throttles for the credential broker
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref SimpleStsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopic
    Properties:
      AlarmDescription: HTTP API server errors for the credential broker
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  ApiDependencyFailureMetric:
    Type: AWS::Logs::MetricFilter
    Condition: HasAlarmTopic
    Properties:
      LogGroupName: !Ref ApiAccessLogGroup
      FilterPattern: '{ ($.status = "422") || ($.status = "424") }'
      MetricTransformations:
        - MetricNamespace: !Sub ${AWS::StackName}/simple-sts
          MetricName: DependencyFailures
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  ApiDependencyFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopic
    Properties:
      AlarmDescription: GitHub App authentication, permission, or token-request failures
      Namespace: !Sub ${AWS::StackName}/simple-sts
      MetricName: DependencyFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopic
    Properties:
      AlarmDescription: Sustained HTTP API client-error spike for the credential broker
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

Outputs:
  ApiUrl:
    Description: Base API URL
    Value: !GetAtt Api.ApiEndpoint
  PolicyAudience:
    Description: Expected GitHub Actions OIDC audience
    Value: !If
      - HasPolicyAudience
      - !Ref PolicyAudience
      - !GetAtt Api.ApiEndpoint
  ExchangeUrl:
    Description: Full exchange endpoint URL
    Value: !Sub ${Api.ApiEndpoint}/exchange
